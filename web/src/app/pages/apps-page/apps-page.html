<div class="max-w-lg mx-auto space-y-4">
  <div class="flex items-center gap-2">
    <h1 class="text-xl font-bold">Apps</h1>
    <button (click)="refresh()" class="bg-gray-600 hover:bg-gray-500 rounded px-3 py-1 text-xs">Refresh</button>
  </div>

  <input [(ngModel)]="filter" placeholder="Search packages..." class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" />

  <div class="space-y-1">
    @for (pkg of filteredApps; track pkg) {
      <div class="flex items-center justify-between bg-gray-800 rounded px-3 py-2">
        <span class="text-sm truncate">{{ pkg }}</span>
        <div class="flex gap-1 shrink-0">
          <button (click)="launch(pkg)" class="bg-green-600 hover:bg-green-500 rounded px-2 py-1 text-xs">Launch</button>
          <button (click)="kill(pkg)" class="bg-red-600 hover:bg-red-500 rounded px-2 py-1 text-xs">Kill</button>
        </div>
      </div>
    }
  </div>

  @if (apps.isLoading()) {
    <p class="text-gray-400 text-sm">Loading...</p>
  }
</div>
