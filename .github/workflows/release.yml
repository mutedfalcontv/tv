name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Test web
        run: npm test -- --watch=false
        working-directory: web
      - name: Build web UI
        run: npm run build
        working-directory: web
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          ldflags="-s -w -X github.com/mutedfalcontv/tv/internal/help.Version=${VERSION} -X main.version=${VERSION}"
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            bin="tv-${VERSION}-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="${ldflags}" -o "dist/${bin}" ./cmd/tv
            stage="staging/${os}-${arch}"; mkdir -p "$stage"; ab="tv${ext}"
            cp "dist/${bin}" "$stage/${ab}"
            if [ "$os" = "windows" ]; then (cd "$stage" && zip -q "../../dist/tv-${VERSION}-${os}-${arch}.zip" "$ab")
            else tar -czf "dist/tv-${VERSION}-${os}-${arch}.tar.gz" -C "$stage" "$ab"; fi
          done
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum tv-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$tag" --generate-notes --prerelease
          else
            pre=""; echo "$tag" | grep -Eqi -- '-(alpha|beta|rc)' && pre="--prerelease"
            gh release create "$tag" dist/* --title "$tag" --generate-notes --verify-tag $pre
          fi
