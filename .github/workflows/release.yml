name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test web
        run: npm test -- --watch=false
        working-directory: web

      - name: Build web UI
        run: npm run build
        working-directory: web

      - name: Test Go
        run: go test ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            bin="tv-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/$bin" ./cmd/tv
          done

      - name: Package archives
        run: |
          set -euo pipefail
          cd dist
          for f in tv-*; do
            case "$f" in
              *.exe) zip -q "${f%.exe}.zip" "$f" ;;
              *) tar -czf "$f.tar.gz" "$f" ;;
            esac
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes --verify-tag
          fi
